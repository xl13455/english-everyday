services:
  english-everyday:
    build:
      context: .
      args:
        NODE_IMAGE: docker.m.daocloud.io/library/node:20-bookworm-slim
    container_name: english-everyday
    restart: unless-stopped
    env_file: .env.local
    # Share host network so MYSQL_HOST=127.0.0.1 works on the same machine
    network_mode: host
